<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { font-family: system-ui, sans-serif; width: 260px; padding: 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
  .field { margin-bottom: 10px; position: relative; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
  }
  .toggle {
    position: absolute;
    right: 8px;
    top: 28px;
    cursor: pointer;
    font-size: 11px;
    color: #666;
    user-select: none;
  }
  button {
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 4px;
  }
  #save { background: #2563eb; color: #fff; }
  #clear { background: #f1f1f1; color: #333; margin-top: 6px; }
  #status { font-size: 12px; margin-top: 8px; min-height: 14px; }
  .footer {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid #eee;
    font-size: 11px;
    color: #888;
    text-align: center;
  }
  .footer a {
    color: #2563eb;
    text-decoration: none;
  }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h2>LPU Auto Login</h2>
  <div class="field">
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="off">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="off">
    <span class="toggle" id="toggle">show</span>
  </div>
  <button id="save">Save</button>
  <button id="clear">Clear saved credentials</button>
  <div id="status"></div>

  <div class="footer">
    🔒 Stored locally only — never sent anywhere.<br>
    <a href="privacy.html" target="_blank">Privacy Policy</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
